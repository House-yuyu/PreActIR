seed: 42

degradations:
  names: [noise, blur, lowlight, haze, jpeg, rain]

tools:
  names: [denoise, deblur, brighten, dehaze, dejpeg, derain]
  strengths: [0.35, 0.65, 1.0]

data:
  root: data/interveneir
  image_size: 256
  max_degradations: 3
  states_per_image: 2
  max_actions_per_state: 12
  spatial_probability: 0.45
  distractor_action_probability: 0.25
  acceptance_target_gain: 0.01
  acceptance_max_damage: 0.02
  num_workers: 4

belief_model:
  base_channels: 32
  dropout: 0.10
  severity_logvar_min: -6.0
  severity_logvar_max: 2.0

world_model:
  base_channels: 32
  feature_dim: 256
  action_embed_dim: 48
  hidden_dim: 384
  dropout: 0.15
  logvar_min: -6.0
  logvar_max: 2.0
  belief_noise_std: 0.03

verifier_model:
  base_channels: 24
  feature_dim: 192
  action_embed_dim: 48
  hidden_dim: 384
  dropout: 0.10

train_belief:
  epochs: 30
  batch_size: 16
  lr: 0.0002
  weight_decay: 0.0001
  amp: true
  grad_clip: 1.0
  save_dir: outputs/belief
  loss_weights:
    presence: 1.0
    severity: 1.0
    mask_bce: 1.0
    mask_dice: 1.0

train_world:
  epochs: 40
  batch_size: 32
  lr: 0.0002
  weight_decay: 0.0001
  amp: true
  grad_clip: 1.0
  save_dir: outputs/world
  loss_weights:
    degradation: 1.0
    quality: 0.5
    damage: 1.0
    accept: 0.5
    ranking: 0.2

train_verifier:
  epochs: 25
  batch_size: 24
  lr: 0.0002
  weight_decay: 0.0001
  amp: true
  grad_clip: 1.0
  save_dir: outputs/verifier
  loss_weights:
    accept: 1.0
    status: 0.75
    target_gain: 0.5
    side_effect: 0.5
    outside_change: 0.5

agent:
  max_steps: 8
  presence_threshold: 0.45
  resolved_threshold: 0.18
  min_target_gain: 0.015
  max_side_effect: 0.08
  max_outside_change: 0.08
  min_planning_utility: -0.05
  learned_verifier_threshold: 0.55
  learned_verifier_mode: weighted
  learned_verifier_weight: 0.55
  use_diagnostic_probes: true
  diagnostic_uncertainty_threshold: 0.30
  diagnostic_blend: 0.30
  top_active_degradations: 3
  horizon: 2
  beam_size: 4
  discount: 0.85
  use_spatial_masks: true
  region_threshold: 0.45
  utility_weights:
    target_gain: 2.0
    quality_gain: 0.8
    side_effect: 1.5
    damage: 2.0
    uncertainty: 0.35
    cost: 0.05
